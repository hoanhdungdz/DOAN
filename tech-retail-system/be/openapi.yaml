components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group_name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        user:
          type: integer
        group:
          type: integer
        store:
          type: integer
      required:
      - email
      - group
      - group_name
      - id
      - store
      - user
    AssignmentRequest:
      type: object
      properties:
        user:
          type: integer
        group:
          type: integer
        store:
          type: integer
      required:
      - group
      - store
      - user
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 80
        object_type:
          type: string
          maxLength: 80
        object_id:
          type: string
          maxLength: 80
        changes: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
        store:
          type: integer
          nullable: true
      required:
      - action
      - created_at
      - id
      - object_id
      - object_type
    AuthInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        full_name:
          type: string
          minLength: 1
        token:
          type: string
          writeOnly: true
          minLength: 1
        current_password:
          type: string
          writeOnly: true
          minLength: 1
    Balance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        available:
          type: integer
          readOnly: true
        sku:
          type: string
          readOnly: true
        product_name:
          type: string
          readOnly: true
        store:
          type: integer
          readOnly: true
        warehouse_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        on_hand:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        reserved:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        alert_threshold:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        warehouse:
          type: integer
        variant:
          type: integer
      required:
      - available
      - created_at
      - id
      - product_name
      - sku
      - store
      - updated_at
      - variant
      - warehouse
      - warehouse_name
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
      required:
      - id
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        is_active:
          type: boolean
      required:
      - name
    CartInputRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItemRequest'
      required:
      - items
    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
        warnings:
          type: array
          items:
            type: string
      required:
      - items
      - warnings
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        source_key:
          type: string
          maxLength: 100
        is_active:
          type: boolean
      required:
      - id
      - name
      - source_key
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        source_key:
          type: string
          minLength: 1
          maxLength: 100
        is_active:
          type: boolean
      required:
      - name
      - source_key
    ChannelEnum:
      enum:
      - ONLINE
      - IN_STORE
      type: string
      description: |-
        * `ONLINE` - ONLINE
        * `IN_STORE` - IN_STORE
    ChatInputRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        history:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 10
      required:
      - question
    CheckoutItemRequest:
      type: object
      properties:
        variant:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 1000
          minimum: 1
      required:
      - quantity
      - variant
    CheckoutRequest:
      type: object
      properties:
        warehouse:
          type: integer
          minimum: 1
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          default: ONLINE
        customer:
          type: integer
          minimum: 1
          nullable: true
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 30
        address:
          type: string
          default: ''
          maxLength: 500
        fulfillment:
          $ref: '#/components/schemas/FulfillmentEnum'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItemRequest'
      required:
      - fulfillment
      - items
      - payment_method
      - phone
      - recipient_name
      - warehouse
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
