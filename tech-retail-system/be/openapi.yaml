          type: boolean
        store:
          type: integer
      required:
      - name
      - store
    BusinessError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: true
        request_id:
          type: string
          format: uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
